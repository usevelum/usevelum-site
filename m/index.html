<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensaje protegido con Velum Via</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07110d;
      color: #f4fff8;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 560px;
      padding: 28px;
      border: 1px solid rgba(52, 199, 89, .24);
      border-radius: 24px;
      background: rgba(255,255,255,.045);
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
    }
    .icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(52, 199, 89, .12);
      color: #34C759;
      font-size: 28px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      color: rgba(244, 255, 248, .75);
      line-height: 1.55;
      font-size: 16px;
    }
    .note {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(52, 199, 89, .08);
      color: rgba(244, 255, 248, .82);
      font-size: 14px;
    }
    .button {
      margin-top: 22px;
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: #34C759;
      color: #041007;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">🔒</div>
    <h1>Mensaje protegido con Velum Via</h1>
    <p>Este enlace contiene un mensaje protegido. Para abrirlo, usá la app Velum Via en tu teléfono.</p>
    <div class="note">La llave de apertura permanece en tu dispositivo y no se envía al servidor.</div>
    <a class="button" href="/">Conocer Velum Via</a>
  </main>
</body>
</html>
