<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velum Via</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07110d;
      color: #f4fff8;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }
    main {
      max-width: 560px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid rgba(52, 199, 89, .35);
      border-radius: 999px;
      color: #34C759;
      margin-bottom: 18px;
      font-size: 14px;
    }
    h1 {
      font-size: clamp(34px, 7vw, 56px);
      margin: 0 0 12px;
    }
    p {
      color: rgba(244, 255, 248, .75);
      line-height: 1.55;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Velum Via</div>
    <h1>Mensajes protegidos</h1>
    <p>Velum Via permite crear y abrir mensajes protegidos desde la app, con cifrado local y validaciones del dispositivo.</p>
  </main>
</body>
</html>
